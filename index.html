<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{padding:24px;border-bottom:1px solid #242735}
.logo{font-size:27px;font-weight:bold;letter-spacing:2px}
.logo span{color:#9c83ff}
main{max-width:750px;margin:auto;padding:25px}
h1{font-size:32px}
p{color:#a5a8b8}
.chat{height:55vh;overflow:auto;padding:15px;background:#111521;border:1px solid #292d3d;border-radius:16px}
.msg{padding:13px;margin:10px 0;border-radius:12px;background:#20263a;line-height:1.5}
.user{background:#51418a;margin-left:35px}
form{display:flex;gap:8px;margin-top:15px}
input{min-width:0;flex:1;padding:16px;background:#171c2a;color:white;border:1px solid #34394d;border-radius:12px}
button{padding:14px;background:#8c72ed;color:white;border:0;border-radius:12px;font-weight:bold}
#history{margin-top:20px}
</style>
</head>
<body>
<header><div class="logo">VELORA <span>AI.</span></div></header>
<main>
<h1>Your personal AI assistant.</h1>
<p>Welcome to the future. What can I help you with?</p>
<div class="chat" id="chat">
<div class="msg">Hei! Olen Velora AI. Miten voin auttaa sinua tänään?</div>
</div>
<form id="form">
<input id="message" placeholder="Kirjoita viesti..." autocomplete="off">
<button>Lähetä</button>
</form>
<button id="history">Show History</button>
</main>
<script>
const chat=document.getElementById('chat');
const form=document.getElementById('form');
const input=document.getElementById('message');
form.addEventListener('submit',e=>{
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const user=document.createElement('div');
user.className='msg user';
user.textContent=value;
chat.appendChild(user);
const reply=document.createElement('div');
reply.className='msg';
reply.textContent='Kiitos viestistäsi! Velora AI:n tekoälyyhteys pitää vielä ottaa käyttöön.';
chat.appendChild(reply);
input.value='';
chat.scrollTop=chat.scrollHeight;
});
document.getElementById('history').onclick=()=>{
alert('Keskusteluhistoria näkyy tässä tulevassa versiossa.');
};
</script>
</body>
</html>
